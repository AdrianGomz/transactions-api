name: spin-transactions

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-transactions}
      POSTGRES_USER: ${DB_USERNAME:-spin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spin-local-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:${WIREMOCK_PORT:-8081}:8080"
    volumes:
      - ./infra/wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
