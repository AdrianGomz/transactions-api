name: spin-transactions

services:
  app:
    image: spin-transactions:local
    build:
      context: .
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-transactions}
      DB_USERNAME: ${DB_USERNAME:-spin}
      DB_PASSWORD: ${DB_PASSWORD:-spin-local-dev}
      PROVIDER_BASE_URL: http://wiremock:8080
      PROVIDER_CONNECT_TIMEOUT: ${PROVIDER_CONNECT_TIMEOUT:-1s}
      PROVIDER_RESPONSE_TIMEOUT: ${PROVIDER_RESPONSE_TIMEOUT:-3s}
      PROVIDER_CONNECTION_REQUEST_TIMEOUT: ${PROVIDER_CONNECTION_REQUEST_TIMEOUT:-1s}
      PROVIDER_MAX_CONNECTIONS: ${PROVIDER_MAX_CONNECTIONS:-20}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    stop_grace_period: 30s

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-transactions}
      POSTGRES_USER: ${DB_USERNAME:-spin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spin-local-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:${WIREMOCK_PORT:-8081}:8080"
    volumes:
      - ./infra/wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
