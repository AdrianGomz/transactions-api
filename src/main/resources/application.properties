spring.application.name=transactions

# Share optional local overrides with Docker Compose. Environment variables win.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${DB_NAME:transactions}}
spring.datasource.username=${DB_USERNAME:spin}
spring.datasource.password=${DB_PASSWORD:spin-local-dev}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

# Flyway owns schema changes; Hibernate only checks the resulting schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The provider adapter will consume this setting when implemented.
provider.base-url=${PROVIDER_BASE_URL:http://localhost:${WIREMOCK_PORT:8081}}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
