spring.application.name=transactions

# Share optional local overrides with Docker Compose. Environment variables win.
spring.config.import=optional:file:.env[.properties]

# Console logs use the request ID supplied by RequestIdFilter; DEBUG is opt-in.
logging.level.root=INFO
logging.level.com.spin.transactions=${APP_LOG_LEVEL:INFO}
logging.pattern.level=%5p [requestId=%X{requestId:-}]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${DB_NAME:transactions}}
spring.datasource.username=${DB_USERNAME:spin}
spring.datasource.password=${DB_PASSWORD:spin-local-dev}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

# Flyway owns schema changes; Hibernate only checks the resulting schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Bounds per HTTP attempt; the adapter retries an uncertain outcome once.
# Additional HTTP-client retries and redirects are disabled.
provider.base-url=${PROVIDER_BASE_URL:http://localhost:${WIREMOCK_PORT:8081}}
provider.connect-timeout=${PROVIDER_CONNECT_TIMEOUT:1s}
provider.response-timeout=${PROVIDER_RESPONSE_TIMEOUT:3s}
provider.connection-request-timeout=${PROVIDER_CONNECTION_REQUEST_TIMEOUT:1s}
provider.max-connections=${PROVIDER_MAX_CONNECTIONS:20}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
